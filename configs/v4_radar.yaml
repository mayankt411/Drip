# Radar study (v4). Windows and thresholds are fixed before any radar number is computed.
stac: "https://planetarycomputer.microsoft.com/api/stac/v1"
collection: "sentinel-1-rtc"
start: "2018-01-01"
end: "2026-10-31"
min_passes_per_year: 30
workers: 8
retries: 3
train_start: "2018-01-01"
train_end: "2022-12-31"
test_start: "2023-01-01"
test_end: "2024-06-30"
confirm_start: "2024-07-01"
confirm_end: "2026-10-31"
rim_inner: 1.2
rim_outer: 1.6
disc_shrink: 0.9
min_valid_fraction: 0.5
min_baseline_passes: 5
large_tank_min_m: 45.0
ridge_alphas: [0.01, 0.1, 1.0, 10.0, 100.0]
cv_folds: 5
h3:
  r_min: 0.65
  p_max: 0.001
  diff_lags: [0, 1]
